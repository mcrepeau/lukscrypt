name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          # Tokenless upload works for public repos; add a CODECOV_TOKEN
          # secret to enable uploads from forks/PRs too. Never fail CI over it.
          fail_ci_if_error: false

  integration:
    name: Integration (real cryptsetup, root)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools and load kernel modules
        run: |
          sudo apt-get update
          sudo apt-get install -y cryptsetup e2fsprogs
          # File-backed LUKS needs loop devices; dm-crypt needs device-mapper.
          # GitHub runners are full VMs, so modprobe works here.
          sudo modprobe loop || true
          sudo modprobe dm_mod || true

      - name: Run integration tests (real create/unlock/grow/keyslot/lock/delete)
        run: sudo -E env "PATH=$PATH" go test -tags integration -race -count=1 -v ./internal/vault/
