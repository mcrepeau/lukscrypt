<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUKSCrypt — Sign in</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235eead4' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='11' width='18' height='11' rx='2'/%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'/%3E%3Ccircle cx='12' cy='16' r='1.5'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d1a; --surface: #13131f; --card: #1a1a2e; --border: #2a2a45;
    --primary: #5eead4; --primary-d: #2dd4bf; --danger: #f87171;
    --text: #e2e8f0; --text-dim: #64748b; --text-muted: #94a3b8;
  }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 2rem; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-bottom: 1.5rem; }
  .logo svg { width: 22px; height: 22px; }
  .form-group { margin-bottom: 1rem; }
  .form-label { display: block; margin-bottom: .4rem; font-size: .78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
  input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); font-size: .85rem; padding: 9px 12px; outline: none;
  }
  input:focus { border-color: var(--primary); }
  .btn {
    width: 100%; padding: 9px 14px; border-radius: 7px; border: 1px solid var(--primary);
    background: var(--primary); color: #0d1117; font-size: .85rem; font-weight: 600;
    cursor: pointer; margin-top: .5rem;
  }
  .btn:hover:not(:disabled) { background: var(--primary-d); border-color: var(--primary-d); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  #err { color: var(--danger); font-size: .8rem; min-height: 1.2em; margin-top: .75rem; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <circle cx="12" cy="16" r="1.5"/>
    </svg>
    LUKSCrypt
  </div>
  <form id="login-form" onsubmit="doLogin(); return false;">
    <div class="form-group">
      <label class="form-label" for="user">Username</label>
      <input type="text" id="user" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="pass">Password</label>
      <input type="password" id="pass" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="login-btn">Sign in</button>
    <div id="err"></div>
  </form>
</div>
<script>
'use strict';
async function doLogin() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('err');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user: document.getElementById('user').value,
        password: document.getElementById('pass').value,
      }),
    });
    if (res.ok) { window.location.href = '/'; return; }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || ('HTTP ' + res.status);
  } catch (e) {
    err.textContent = 'Network error — is the server up?';
  }
  btn.disabled = false;
  btn.textContent = 'Sign in';
}
</script>
</body>
</html>
