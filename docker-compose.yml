services:
  lukscrypt:
    image: ghcr.io/mcrepeau/lukscrypt:latest
    container_name: lukscrypt
    ports:
      - "8080:8080"
    volumes:
      # Persist the SQLite database
      - lukscrypt-data:/data
      # Vault image files MUST live on a persistent bind mount or named
      # volume. Without this, images are stored in the container's writable
      # layer and are destroyed whenever the container is recreated
      # (compose down, image upgrade, ...).
      - type: bind
        source: /srv/lukscrypt/vaults   # adjust to a persistent host path
        target: /vaults
      # Shared propagation: mounts created inside the container propagate to
      # the host. Requires the host directories to be shared mounts — on
      # Debian 12 with systemd this is the default. If not, run once on the
      # host: mount --make-shared /tank && mount --make-shared /mnt
      - type: bind
        source: /mnt
        target: /mnt
        bind:
          propagation: shared
    environment:
      DB_PATH: /data/lukscrypt.db
      VAULT_STORAGE_DIRS: /vaults
      VAULT_MOUNT_DIRS: /mnt
      # AUTH_USER: admin          # default: admin
      # AUTH_PASSWORD: changeme   # default: random, printed once in container logs
      # TRUST_PROXY: "true"       # set when running behind a TLS reverse proxy so
      #                           # unlock rate limiting uses X-Forwarded-For
    privileged: true
    restart: unless-stopped

volumes:
  lukscrypt-data:
